<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Personal Finance Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-icon">
                ₹
            </div>

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Manage your money. Build your future.
            </p>

            <form id="login-form">

                <div class="input-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Login →
                </button>
                <p id="login-message"></p>

            </form>
<p>
    Don't have an account?
    <a href="registerpage.html">Create Account</a>
</p>
            <p class="login-footer">
                Personal Finance Manager
            </p>

        </div>

    </div>


    <script>
document.getElementById("login-form").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("https://personal-finance-manager-z8z1.onrender.com/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {

            // Save logged-in user information
            localStorage.setItem("userId", data.userId);
            localStorage.setItem("username", data.username);

            window.location.href = "index.html";

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Cannot connect to the server. Make sure the backend is running.");

    }

});
</script>
</body>
</html>
